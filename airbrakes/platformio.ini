[env:airbrakes]
platform = ststm32@20.0.0
framework = stm32cube
board = devebox_h743vitx
extra_scripts = pre:scripts/fpu.py
lib_extra_dirs =
    ../lib/H7
upload_protocol = dfu
build_unflags = -Os
monitor_speed = 115200
board_build.f_cpu = 64000000L
build_flags =
    -O3
    -mfpu=fpv5-d16
    -mfloat-abi=hard
    -Wl,-u,_printf_float
    -Wl,-u,_scanf_float
    -Isrc/app
    -Isrc/osqp
    -Isrc/osqp/inc/public
    -Isrc/osqp/inc/private

[env:airbrakes]
platform = ststm32@20.0.0
framework = stm32cube
board = devebox_h743vitx
lib_extra_dirs =
    ../lib/H7
upload_protocol = dfu
; The example uses the reset-state internal HSI clock, without a board crystal.
board_build.f_cpu = 64000000L
extra_scripts = pre:scripts/fpu.py
; Preserve the earlier two-variable solver experiment, but do not compile it.
build_src_filter =
    -<*>
    +<main.c>
    +<mpc.c>
build_unflags = -Os
build_flags =
    -O3
    -mfpu=fpv5-d16
    -mfloat-abi=hard

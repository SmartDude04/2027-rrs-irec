[env:airbrakes]
platform = ststm32@20.0.0
framework = stm32cube
board = devebox_h743vitx
lib_extra_dirs =
    ../lib/H7
upload_protocol = dfu
board_build.f_cpu = 64000000L
extra_scripts = pre:scripts/fpu.py
; build_src_filter =
;     -<*>
;     +<main.c>
;     +<mpc.c>
;     -<app/test_host.c>
build_unflags = -Os
build_flags =
    -O3
    -mfpu=fpv5-d16
    -mfloat-abi=hard
    -Isrc/app
    -Isrc/osqp
    -Isrc/osqp/inc/public
    -Isrc/osqp/inc/private
    -Wl-u,_printf_float
    -lm
